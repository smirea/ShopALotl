pre-commit:
  jobs:
    # CI and cloud agents don't have the shared command.
    - name: worktree
      run: '[ ! -x "$HOME/bin/agent-t3-worktree" ] || "$HOME/bin/agent-t3-worktree" check --heal'
    - group:
        parallel: true
        jobs:
          # One job: both fixers rewrite the same staged files, and in parallel one would overwrite the other's edit.
          - name: fix
            run: >-
              bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
              && bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: typecheck
            glob: '*.{js,mjs,mts,ts,tsx,json,jsonc}'
            run: bun run typecheck
          - name: schema
            glob: ['server/schema.ts', 'scripts/generate.ts', 'Sources/App/Sync/Generated/*', 'bun.lock']
            run: bun run schema:check
          # The whole suite: logic tests run in-process in milliseconds, so selecting by diff would save little and
          # could miss a test whose input is not an import. Git exports GIT_DIR and GIT_INDEX_FILE to hooks, so a
          # test that runs git in a temp directory would act on this repository unless they are unset first.
          - name: test
            glob: '*.{js,mjs,mts,ts,tsx,json}'
            run: unset $(git rev-parse --local-env-vars); bun run test
          # The app's logic tests run on the Mac with no simulator. The first run in a new worktree also compiles the package.
          - name: swift
            glob: ['*.swift', 'Package.resolved']
            run: unset $(git rev-parse --local-env-vars); swift test
